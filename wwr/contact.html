<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title> Contact us at the Nile River Explorers.</title>
    <meta name="description"
      content=" Contact us at the Nile River Explorers for inquiries,bookings, reservations, ratings, referals and more...  ">
    <meta name="author" content="BWIRE MOSES">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt=" White Water rafting">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <!-- Map and Form Section -->
        <section class="contact-section">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d769.0019908379659!2d-120.8299463726517!3d39.559428001362946!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sug!4v1774848686831!5m2!1sen!2sug"
                  width="600" height="450" ;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="contact-form">
                <form>

                    <label for="user-name">Name</label>
                    <input type="text" id="user-name" name="user-name" placeholder="Placeholder">

                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" name="user-email" placeholder="Placeholder">

                    <label>Message Purpose</label>
                    <div class="radio-group">
                        <label><input type="radio" name="purpose" id="purpose-general"
                              value="general"> General Inquiry</label><br>
                        <label><input type="radio" name="purpose" id="purpose-reservation"
                              value="reservation"> Reservation Question</label><br>
                        <label><input type="radio" name="purpose" id="purpose-suggestion"
                              value="suggestion"> Website Suggestion</label>
                    </div>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>

                    <div class="subscribe">
                        <label for="subscribe"><input type="checkbox" id="subscribe"
                              name="subscribe"> Please Subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <button type="submit">Get in Touch!</button>

                </form>
            </div>

        </section>

        <!-- Employee Section -->
        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-container">

                <div class="employee">
                    <img src="employee1.png" alt="Employee">
                    <p>Employee Profile</p>
                </div>

                <div class="employee">
                    <img src="employee2.png" alt="Employee">
                    <p>Employee Profile</p>
                </div>

                <div class="employee">
                    <img src="employee3.png" alt="Employee">
                    <p>Employee Profile</p>
                </div>

            </div>

        </section>

    </main>

    <Footer>
        <p> ©2026 Nile River Explorers BWIRE MOSES</p>
        <nav class="socialmedia">
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram Icon" widith="25">
            </a>
            <a href="https://whatsapp.com">
                <img src="images/whatsapp.jpg" alt="Whatsapp Icon" widith="25">
            </a>
            <a href="https://Youtube.com">
                <img src="images/youtube.jpg" alt="Youtube Icon" widith="25">
            </a>
        </nav>
    </Footer>
</body>

</html>
